name: iOS integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: macos-latest
    strategy:
      matrix:
        timezone: [UTC, Australia/Brisbane, America/New_York]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Check assignment session planning
        run: node Tools/session-planning-smoke.cjs
      - name: Check find-time planning
        run: node Tools/find-time-smoke.cjs
      - name: Check touch scheduling engine
        run: node Tools/schedule-touch-smoke.cjs
      - name: Check planner search
        run: node Tools/planner-search-smoke.cjs
      - name: Check web-compatible Today
        run: node Tools/today-smoke.cjs
      - name: Check planning settings
        run: node Tools/planning-settings-smoke.cjs
      - name: Check assignment progress
        run: node Tools/assignment-progress-smoke.cjs
      - name: Check recurring authoring
        run: node Tools/recurring-edit-smoke.cjs
      - name: Check task-linked focus
        run: node Tools/focus-smoke.cjs
      - run: swift test
  app-build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Verify shared icon assets and call sites
        run: node Tools/check-icons.cjs
      - name: Build the existing iOS app without signing
        run: xcodebuild -project Kairos/Kairos.xcodeproj -scheme Kairos -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/kairos-build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build
      - name: Verify bundled schedule engines
        run: |
          test -s /tmp/kairos-build/Build/Products/Debug-iphonesimulator/Kairos.app/recurrence-engine.js
          test -s /tmp/kairos-build/Build/Products/Debug-iphonesimulator/Kairos.app/schedule-engine.js
          test -s /tmp/kairos-build/Build/Products/Debug-iphonesimulator/Kairos.app/schedule-touch-engine.js
          test -s /tmp/kairos-build/Build/Products/Debug-iphonesimulator/Kairos.app/planner-search-engine.js
          test -s /tmp/kairos-build/Build/Products/Debug-iphonesimulator/Kairos.app/today-engine.js
          test -s /tmp/kairos-build/Build/Products/Debug-iphonesimulator/Kairos.app/planning-settings-engine.js
          test -s /tmp/kairos-build/Build/Products/Debug-iphonesimulator/Kairos.app/assignment-progress-engine.js
          test -s /tmp/kairos-build/Build/Products/Debug-iphonesimulator/Kairos.app/focus-engine.js
          test -s /tmp/kairos-build/Build/Products/Debug-iphonesimulator/Kairos.app/planning-engine.js
      - name: Verify Firebase Firestore security floor
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('Kairos/Kairos.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved')
          pins = json.loads(path.read_text())['pins']
          firebase = next(pin for pin in pins if pin['identity'] == 'firebase-ios-sdk')
          version = tuple(map(int, firebase['state']['version'].split('.')))
          assert (12, 19, 3) <= version < (13, 0, 0), 'Firebase 12.19.3+ is required for the Firestore trust-store security fix'
          print('Firebase security floor passed:', firebase['state']['version'])
          PY
      - name: Upload Xcode-resolved dependency pins
        uses: actions/upload-artifact@v4
        with:
          name: ios-resolved-packages
          path: Kairos/Kairos.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

  toolbar-layout:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check rendered iOS 26 toolbar bounds
        run: bash Tools/toolbar-visual-smoke.sh
      - name: Upload toolbar screenshots and bounds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-toolbar-regression
          path: /tmp/kairos-toolbar-artifacts



